services:
  sheltie:
    build: .
    container_name: sheltie
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config
      - ./state:/app/state
    environment:
      TZ: Asia/Kolkata
      PORT: 8710
      SHELTIE_API_PORT: 8711
      SHELTIE_API_BASE: http://127.0.0.1:8711
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SHELTIE_TELEGRAM_BOT_TOKEN: ${SHELTIE_TELEGRAM_BOT_TOKEN:-}
      SHELTIE_TELEGRAM_CHAT_ID: ${SHELTIE_TELEGRAM_CHAT_ID:-}
      SHELTIE_ACTION_TOKEN: ${SHELTIE_ACTION_TOKEN:-}
