services:
  labwarden:
    build: .
    container_name: labwarden
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config
      - ./state:/app/state
    environment:
      TZ: Asia/Kolkata
      PORT: 8710
      LABWARDEN_API_PORT: 8711
      LABWARDEN_API_BASE: http://127.0.0.1:8711
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LABWARDEN_TELEGRAM_BOT_TOKEN: ${LABWARDEN_TELEGRAM_BOT_TOKEN:-}
      LABWARDEN_TELEGRAM_CHAT_ID: ${LABWARDEN_TELEGRAM_CHAT_ID:-}
      LABWARDEN_ACTION_TOKEN: ${LABWARDEN_ACTION_TOKEN:-}
