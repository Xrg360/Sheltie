name: Website

# Builds the public website (website/) plus the live demo (the real dashboard in demo mode)
# and deploys them to GitHub Pages at https://sheltie.simplewebsite.in.
on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "src/**"
      - "docs/**"
      - "*.md"
      - "package*.json"
      - "next.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://sheltie.simplewebsite.in' }}
    steps:
      # GITHUB_TOKEN cannot turn Pages on, so until the owner does, build the site
      # (to catch regressions) but skip deployment with a clear warning instead of failing.
      - name: Check GitHub Pages is enabled
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.setOutput("enabled", "true");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("enabled", "false");
              const help = "GitHub Pages is not enabled, so the site was built but not deployed. " +
                "Enable it in Settings → Pages → Source: GitHub Actions, set the custom domain to sheltie.simplewebsite.in, " +
                "add the DNS record CNAME sheltie → xrg360.github.io, then re-run this workflow.";
              core.warning(help);
              await core.summary.addHeading("Website built, deployment skipped").addRaw(help).write();
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Build live demo
        run: |
          npm ci
          npm run build:demo
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Merge demo into site
        run: |
          mkdir -p website/out/demo
          cp -r out/. website/out/demo/
          touch website/out/.nojekyll
          echo "${SITE_URL#https://}" > website/out/CNAME
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: website/out

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
